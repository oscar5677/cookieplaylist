name: Update Channels JSON

on:
  schedule:
    # Runs at the top and bottom of every hour (UTC). GitHub may delay this
    # slightly under load — scheduled workflows are "best effort".
    - cron: '0,30 * * * *'
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write  # needed so the workflow can push the updated JSON

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and convert playlist
        run: python scripts/fetch_and_convert.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add channels.json
          git diff --cached --quiet || git commit -m "chore: update channels.json [skip ci]"
          git push
